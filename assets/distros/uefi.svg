<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Subtle circular/rounded backing -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#2d333b" stroke="#444c56" stroke-width="2"/>
  <!-- Bright Silver Pins -->
  <path stroke="#c9d1d9" stroke-width="3.5" stroke-linecap="round" d="
    M26 13v9 M38 13v9 M50 13v9 M62 13v9 M74 13v9
    M26 78v9 M38 78v9 M50 78v9 M62 78v9 M74 78v9
    M13 26h9 M13 38h9 M13 50h9 M13 62h9 M13 74h9
    M78 26h9 M78 38h9 M78 50h9 M78 62h9 M78 74h9
  "/>
  <!-- Integrated Circuit body -->
  <rect x="22" y="22" width="56" height="56" rx="8" fill="#1c2128" stroke="#768390" stroke-width="2"/>
  <!-- Pin 1 marker notch/dot -->
  <circle cx="31" cy="31" r="3" fill="#adbac7"/>
  <!-- High contrast BIOS text -->
  <text x="50" y="55" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">BIOS</text>
</svg>
