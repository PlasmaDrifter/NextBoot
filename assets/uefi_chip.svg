  <!-- Silicon Die -->
  <rect x="30" y="30" width="40" height="40" rx="4" fill="#0d1117" stroke="url(#coreGold)" stroke-width="1.5"/>
  <rect x="36" y="36" width="28" height="28" rx="2" fill="#1c2128"/>
